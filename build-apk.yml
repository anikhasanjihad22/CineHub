name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Install Expo-matched packages
        run: npx expo install expo-status-bar expo-linear-gradient expo-video expo-file-system expo-screen-orientation expo-build-properties react-native-svg react-native-screens react-native-safe-area-context @react-native-async-storage/async-storage

      - name: Align versions with the Expo SDK
        run: npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CineHub.apk
          gh release create "build-${{ github.run_number }}" CineHub.apk --title "CineHub build ${{ github.run_number }}" --notes "Android APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CineHub-apk
          path: CineHub.apk
